serial_bridge:
  ros__parameters:
    # Stable symlink from /etc/udev/rules.d/99-ars-robot.rules. Do NOT use a
    # raw /dev/ttyUSB* number here: this Mega is a CH340 clone (so it is
    # ttyUSB*, not ttyACM*) and the lidar is also a USB-serial device, so the
    # numbering swaps depending on plug order.
    port: /dev/arduino
    baud: 115200

    # Set true to run the whole node with no Arduino attached: cmd_vel is
    # accepted and the M lines it would send are logged instead. Useful for
    # testing the graph before the robot is wired up.
    dry_run: false

    # ---- from encoder_calibration.ino: keep in sync with the sketch -------
    wheel_diameter: 0.095
    ticks_per_rev: 70.6

    # ---- MEASURE ON THE REAL CHASSIS -------------------------------------
    # Must match sep_x / sep_y in urdf/ars_robot.urdf.xacro.
    wheel_separation_x: 0.20     # front axle to rear axle, metres
    wheel_separation_y: 0.20     # left wheel to right wheel, metres

    # ---- MEASURE ON THE REAL ROBOT ---------------------------------------
    # Wheel speed in m/s at throttle 1.0. The base is open loop, so this is
    # the single number that converts a cmd_vel into a throttle: get it wrong
    # and the robot moves at the wrong speed AND odometry stays correct
    # (odometry comes from encoders, not from this), so the symptom is Nav2
    # consistently over- or under-shooting.
    # HOW: prop the robot up, press 't' then '+' to full throttle in the
    # firmware, and read the m/s column of the telemetry.
    max_wheel_speed: 0.60

    cmd_timeout: 0.5             # cmd_vel silence before we command a stop
    tx_rate: 20.0                # Hz; must beat the firmware's 200 ms watchdog
    publish_tf: true
    odom_frame: odom
    base_frame: base_link
